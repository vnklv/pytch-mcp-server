[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytch-mcp"
version = "1.0.0"
description = "Official Model Context Protocol (MCP) server for Pytch — Autonomous PR, Journalist Discovery, Deliverability Audit, and AI Brand Visibility."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Pytch Team", email = "support@pytch.cc" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "pr",
    "public-relations",
    "media-outreach",
    "deliverability",
    "spf-dkim-dmarc",
    "geo",
    "ai-visibility"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://pytch.cc"
Repository = "https://github.com/pytch-cc/pytch-mcp-server"
Documentation = "https://github.com/pytch-cc/pytch-mcp-server#readme"

[project.scripts]
pytch-mcp = "pytch_mcp.server:main"
